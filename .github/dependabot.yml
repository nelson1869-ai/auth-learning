# Dependabot (Day 87): kusang PR kapag may bagong version ng isang dependency. Sinusuri ito ng CI gaya ng ibang PR,
# at ako (Nelson) ang nagme-merge — walang auto-merge.
#
# cooldown: maghintay ng 7 araw pagkatapos ilabas ang isang version bago mag-PR. Ang mga malisyosong version sa npm
# (hal. ninakaw ang account ng maintainer) ay kadalasang natutuklasan at inaalis sa loob ng ilang araw.
# groups: iisang PR para sa lahat ng minor/patch → mas kaunting ingay; ang major ay hiwalay (maaaring may breaking change).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    cooldown: { default-days: 7 }
    groups:
      backend-minor-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    cooldown: { default-days: 7 }
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  # Ang mga action sa .github/workflows — naka-pin sa commit SHA; ina-update ng Dependabot ang SHA at ang `# vX.Y.Z` na comment
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  # Base image ng backend (node:24-alpine) — dito nanggagaling ang karamihan ng CVE sa isang container (Day 88)
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    cooldown: { default-days: 7 }
    groups:
      # Day 88: dalawang FROM na dapat PAREHO ang Alpine (node:24-alpine3.24 at alpine:3.24) — kinokopya ang node binary
      # mula sa una papunta sa pangalawa, at binuo ito para sa libstdc++ ng Alpine na iyon. Kaya iisang PR para sa dalawa
      base-images: { patterns: ["*"] }
    ignore:
      # Node: LTS lang (even na numero: 24, 26…). Ang unang PR ng Dependabot ay 24 → 25, na HINDI LTS (maikling suporta).
      # Ang pagpalit ng LTS ay sadyang desisyon (tests + Neon + deps), hindi lingguhang PR. Berde ang CI sa PR na iyon, pero
      # WALANG kahulugan: sa Node 24 (setup-node) tumatakbo ang tests, binubuo lang ang image
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Mga image sa devops/ (postgres, cloudflared, prometheus, grafana, alertmanager) — naka-pin sa eksaktong version
  - package-ecosystem: docker-compose
    directory: /devops
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    cooldown: { default-days: 7 }
    ignore:
      # Postgres: ang major (17 → 18) ay hindi makakapagsimula sa lumang data ng volume — kailangan ng dump/restore.
      # At dapat pareho sa Neon (17) at sa CI (postgres:17-alpine). Sadyang desisyon, hindi lingguhang PR
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      # minor/patch lang ang pinagsasama; ang bawat MAJOR (hal. Grafana 12 → 13) ay hiwalay na PR, para masuri nang isa-isa.
      # ⚠️ Hindi ginagamit ng CI ang mga image na ito — ang berdeng CI ay hindi patunay; subukan nang lokal bago i-merge
      devops-images: { patterns: ["*"], update-types: [minor, patch] }
