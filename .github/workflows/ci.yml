name: CI

# 🎓 Continuous Integration: sa bawat push sa main at bawat PR, kusang sinusuri ng
# GitHub ang code sa isang BAGONG malinis na makina — walang .env, walang lumang
# node_modules. Kung pula, huwag i-merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Postgres na buhay lang habang tumatakbo ang job — totoong database para sa tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Day 92: totoong Redis para sa mga test ng rate limiter (pinagsasaluhang bilang, fail-open, pagbalik ng Redis)
      redis:
        image: redis:8.8.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    # Walang .env.test sa CI (gitignored) — dito nanggagaling ang mga variable.
    # Hindi totoong secret ang mga ito: pang-CI lang, hindi ginagamit kahit saan pa.
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth_learning_test
      CLIENT_URL: http://localhost:5173
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (eksaktong versions mula sa package-lock.json)
        run: npm ci

      # Day 87: dalawang antas. Production (ang tumatakbo sa server): pumapalya kahit moderate.
      # Lahat (kasama ang dev tools): high lang — ang 4 na moderate ay esbuild via drizzle-kit (dev server lang, hindi ginagamit;
      # ang "fix" ng npm ay downgrade sa drizzle-kit 0.18). Tingnan ang journal ng Day 87
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (incl. dev tools)
        run: npm audit --audit-level=high

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Type-check (TypeScript — hindi gumagawa ng JavaScript, sumusuri lang)
        run: npm run typecheck

      # RS256 (Day 56): bagong RSA key sa BAWAT run — pansamantala, walang secret na naka-commit
      - name: Ephemeral JWT key (CI only)
        run: echo "JWT_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | base64 -w0)" >> "$GITHUB_ENV"

      - name: Migrate the test database
        run: npx drizzle-kit migrate

      - name: Test (Vitest + Supertest)
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Day 87: ang dependencies ng frontend ay NAPUPUNTA sa browser ng user (sa bundle), at ang dev tools (vite)
      # ang gumagawa ng bundle — kaya pareho silang sinusuri
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (incl. build tools)
        run: npm audit --audit-level=high

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Day 99: E2E — ang BUONG system sa totoong Chromium (frontend/e2e, Playwright): login, passkeys (virtual authenticator),
  # at kung ano ang nakikita ng user kapag may problema ang server. Ang backend at frontend ay pinapatakbo ng playwright.config.ts
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Walang .env.test sa CI: dito galing ang mga variable ng backend (pareho ng `backend` job). Ang CLIENT_URL at PORT ay sa playwright.config.ts
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth_learning_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install (backend at frontend)
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Ephemeral JWT key (CI only)
        run: echo "JWT_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | base64 -w0)" >> "$GITHUB_ENV"

      - name: Migrate the test database
        working-directory: backend
        run: npx drizzle-kit migrate

      # Ang Chromium na kapareho ng version ng @playwright/test (+ ang mga library ng Linux na kailangan nito)
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        working-directory: frontend
        run: npm run e2e

      # Kapag pumalya: ang report (may trace ng bawat hakbang) — i-download sa Actions → ang run → Artifacts
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # Day 87: may secret ba sa KAHIT ANONG commit (hindi lang sa huli)? Public ang repo — kapag naka-push, nakita na ng lahat.
  # gitleaks bilang Docker image na naka-pin sa DIGEST (hindi tag, hindi third-party action): ang tag ay puwedeng ilipat
  # ng may-ari (o ng nakapasok na attacker) sa ibang code; ang digest ay hindi. Aral ng reference: ang trivy-action tags (2026-03)
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buong history, hindi lang ang huling commit
      - name: gitleaks (buong history · --redact = hindi ipinapakita ang secret sa log)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --verbose

  # CD, bahagi 1 (Day 37): gumagawa ng backend image. Sa bawat PR — build lang (sinusuri ang
  # Dockerfile). Sa merge sa main — push din sa GHCR, naka-tag sa EKSAKTONG commit na pumasa.
  # Walang self-hosted runner: ang PC ang kumukuha ng image (devops/deploy.sh) — D-020.
  image:
    needs: [backend, frontend, e2e, secret-scan] # image lang kapag pumasa ang tests (pati E2E, Day 99) at walang secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN lang — walang dagdag na secret
      id-token: write # Day 89: OIDC token para lagdaan ang attestation (walang secret o key na iniimbak)
      attestations: write
    env:
      IMAGE: ghcr.io/nelson1869-ai/auth-learning-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Day 89: nakatatak sa image kung aling commit ito (makikita sa `docker inspect`)
      - name: Build the backend image
        run: docker build --label "org.opencontainers.image.revision=${{ github.sha }}" -t "$IMAGE:${{ github.sha }}" backend

      # Day 88: may kilalang butas ba ang IMAGE (Alpine packages, ang node binary, at ang npm packages sa loob)?
      # Pumapalya sa High o Critical — BAGO ang push, kaya hindi aabot sa GHCR (at sa production) ang image na may ganoon.
      # Grype bilang image na naka-pin sa digest (parehong dahilan ng gitleaks, D-029). Sinukat: ang image na naka-deploy
      # noong Day 88 (single stage, may zlib High) ay PAPALYA rito; ang multi-stage ay pumapasa (2 Medium, busybox — D-030)
      - name: Scan the image (Grype — pumapalya sa High/Critical)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
          "$IMAGE:${{ github.sha }}" --fail-on high

      - name: Push to GHCR (main lang, pagkatapos ng merge)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
        id: push

      # Day 89: build provenance — nilagdaang patunay (Sigstore, gamit ang OIDC ng GitHub) na ang image na may ganitong DIGEST
      # ay binuo ng workflow na ito, mula sa commit na ito, sa main. Ang tag (`:<sha>`) ay puwedeng ilipat ng kahit sinong may
      # packages:write; ang attestation ay hindi mapepeke nang walang workflow na ito. Sinusuri ng deploy.sh bago mag-deploy
      - name: Attest build provenance (main lang)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

