name: CI

# 🎓 Continuous Integration: sa bawat push sa main at bawat PR, kusang sinusuri ng
# GitHub ang code sa isang BAGONG malinis na makina — walang .env, walang lumang
# node_modules. Kung pula, huwag i-merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Postgres na buhay lang habang tumatakbo ang job — totoong database para sa tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    # Walang .env.test sa CI (gitignored) — dito nanggagaling ang mga variable.
    # Hindi totoong secret ang mga ito: pang-CI lang, hindi ginagamit kahit saan pa.
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth_learning_test
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (eksaktong versions mula sa package-lock.json)
        run: npm ci

      # Day 87: dalawang antas. Production (ang tumatakbo sa server): pumapalya kahit moderate.
      # Lahat (kasama ang dev tools): high lang — ang 4 na moderate ay esbuild via drizzle-kit (dev server lang, hindi ginagamit;
      # ang "fix" ng npm ay downgrade sa drizzle-kit 0.18). Tingnan ang journal ng Day 87
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (incl. dev tools)
        run: npm audit --audit-level=high

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Type-check (TypeScript — hindi gumagawa ng JavaScript, sumusuri lang)
        run: npm run typecheck

      # RS256 (Day 56): bagong RSA key sa BAWAT run — pansamantala, walang secret na naka-commit
      - name: Ephemeral JWT key (CI only)
        run: echo "JWT_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | base64 -w0)" >> "$GITHUB_ENV"

      - name: Migrate the test database
        run: npx drizzle-kit migrate

      - name: Test (Vitest + Supertest)
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Day 87: ang dependencies ng frontend ay NAPUPUNTA sa browser ng user (sa bundle), at ang dev tools (vite)
      # ang gumagawa ng bundle — kaya pareho silang sinusuri
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (incl. build tools)
        run: npm audit --audit-level=high

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Type-check (TypeScript)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Day 87: may secret ba sa KAHIT ANONG commit (hindi lang sa huli)? Public ang repo — kapag naka-push, nakita na ng lahat.
  # gitleaks bilang Docker image na naka-pin sa DIGEST (hindi tag, hindi third-party action): ang tag ay puwedeng ilipat
  # ng may-ari (o ng nakapasok na attacker) sa ibang code; ang digest ay hindi. Aral ng reference: ang trivy-action tags (2026-03)
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buong history, hindi lang ang huling commit
      - name: gitleaks (buong history · --redact = hindi ipinapakita ang secret sa log)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --verbose

  # CD, bahagi 1 (Day 37): gumagawa ng backend image. Sa bawat PR — build lang (sinusuri ang
  # Dockerfile). Sa merge sa main — push din sa GHCR, naka-tag sa EKSAKTONG commit na pumasa.
  # Walang self-hosted runner: ang PC ang kumukuha ng image (devops/deploy.sh) — D-020.
  image:
    needs: [backend, frontend, secret-scan] # image lang kapag pumasa ang tests at walang secret
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN lang — walang dagdag na secret
    env:
      IMAGE: ghcr.io/nelson1869-ai/auth-learning-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the backend image
        run: docker build -t "$IMAGE:${{ github.sha }}" backend

      - name: Push to GHCR (main lang, pagkatapos ng merge)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

