<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>auth-learning · Diagrams</title>
  <!--
    🎓 TEMPLATE ng diagram site. HUWAG direktang buksan ito — patakbuhin ang
    `node docs/diagrams/build.mjs`, na gumagawa ng index.html mula rito.
  -->
  <style>
    :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --side: #f6f8fa; --border: #d1d9e0; --active: #ddf4ff; --accent: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --side: #161b22; --border: #3d444d; --active: #1f2d3d; --accent: #4493f8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; min-height: 100vh; }
    nav { width: 280px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border); padding: 16px 12px; overflow-y: auto; }
    nav h1 { font-size: 1rem; margin: 4px 8px 16px; }
    .group { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 16px 8px 6px; text-transform: uppercase; letter-spacing: 0.03em; }
    nav a { display: block; padding: 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 0.9rem; }
    nav a:hover { background: var(--border); }
    nav a.active { background: var(--active); color: var(--accent); font-weight: 600; }
    main { flex: 1; padding: 24px; overflow-x: auto; min-width: 0; }
    main h2 { margin: 0 0 4px; font-size: 1.25rem; }
    main p { margin: 0 0 20px; color: var(--muted); }
    .error { color: #cf222e; white-space: pre-wrap; }
    .toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar button { font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--side); color: var(--fg); cursor: pointer; }
    .toolbar button:hover { border-color: var(--accent); }
    .toolbar .zoom { min-width: 56px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .toolbar .hint { color: var(--muted); font-size: 0.8rem; margin-left: 8px; }
    /* Sariling scroll area: malalaking diagram ay nag-i-scroll dito, hindi pinapaliit */
    #diagram { overflow: auto; max-height: calc(100vh - 150px); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: grab; }
    #diagram.panning { cursor: grabbing; user-select: none; }
    #diagram svg { max-width: none !important; display: block; }
    @media (max-width: 720px) {
      body { flex-direction: column; }
      nav { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <nav id="nav"><h1>📐 Diagrams</h1></nav>
  <main>
    <h2 id="title"></h2>
    <p id="file"></p>
    <div class="toolbar">
      <button id="zoom-out" title="Paliitin (-)">−</button>
      <span class="zoom" id="zoom-level">100%</span>
      <button id="zoom-in" title="Palakihin (+)">+</button>
      <button id="zoom-reset" title="Totoong laki (0)">100%</button>
      <button id="zoom-fit" title="Ikasya sa lapad (F)">Fit</button>
      <span class="hint">I-drag ang diagram para gumalaw · keyboard: + − 0 F</span>
    </div>
    <div id="diagram"></div>
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    // Isinisingit ng build.mjs ang lahat ng diagram dito
    const pages = __DIAGRAM_DATA__;

    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    // useMaxWidth: false → HUWAG pinapaliit ang malalapad na diagram para
    // magkasya (sa default, 10% na lang ang laki ng text at hindi mabasa).
    // Tayo na ang bahala sa laki gamit ang zoom sa ibaba.
    const natural = { useMaxWidth: false };
    mermaid.initialize({
      startOnLoad: false,
      theme: dark ? 'dark' : 'default',
      flowchart: natural, sequence: natural, er: natural, class: natural, state: natural, gantt: natural,
    });

    // ----- ZOOM: binabago ang width/height ng SVG (malinaw pa rin ang text) -----
    const box = document.getElementById('diagram');
    let zoom = 1;
    let size = null; // natural na laki ng kasalukuyang diagram (mula sa viewBox)

    const applyZoom = () => {
      const svg = box.querySelector('svg');
      if (!svg || !size) return;
      svg.setAttribute('width', size.w * zoom);
      svg.setAttribute('height', size.h * zoom);
      svg.style.width = `${size.w * zoom}px`;
      svg.style.height = `${size.h * zoom}px`;
      document.getElementById('zoom-level').textContent = `${Math.round(zoom * 100)}%`;
    };
    const setZoom = (z) => { zoom = Math.min(4, Math.max(0.1, z)); applyZoom(); };
    const fit = () => size && setZoom(Math.min(1, (box.clientWidth - 32) / size.w));

    document.getElementById('zoom-in').onclick = () => setZoom(zoom * 1.25);
    document.getElementById('zoom-out').onclick = () => setZoom(zoom / 1.25);
    document.getElementById('zoom-reset').onclick = () => setZoom(1);
    document.getElementById('zoom-fit').onclick = fit;
    window.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea')) return;
      if (e.key === '+' || e.key === '=') setZoom(zoom * 1.25);
      else if (e.key === '-') setZoom(zoom / 1.25);
      else if (e.key === '0') setZoom(1);
      else if (e.key.toLowerCase() === 'f') fit();
    });

    // ----- DRAG-TO-PAN: i-click at i-drag para gumalaw (parang Google Maps) -----
    let drag = null;
    box.addEventListener('mousedown', (e) => {
      drag = { x: e.clientX, y: e.clientY, left: box.scrollLeft, top: box.scrollTop };
      box.classList.add('panning');
    });
    window.addEventListener('mousemove', (e) => {
      if (!drag) return;
      box.scrollLeft = drag.left - (e.clientX - drag.x);
      box.scrollTop = drag.top - (e.clientY - drag.y);
    });
    window.addEventListener('mouseup', () => { drag = null; box.classList.remove('panning'); });

    // Navigator: isang grupo bawat .md file, isang link bawat diagram
    const nav = document.getElementById('nav');
    pages.forEach((page, p) => {
      const group = document.createElement('div');
      group.className = 'group';
      group.textContent = page.title;
      nav.appendChild(group);
      page.diagrams.forEach((d, i) => {
        const link = document.createElement('a');
        link.href = `#${p}-${i}`;
        link.textContent = d.label;
        nav.appendChild(link);
      });
    });

    // Ipakita ang diagram na nasa URL (#file-diagram), o ang una kung wala
    let renderCount = 0;
    const show = async () => {
      const [p, i] = (location.hash.slice(1) || '0-0').split('-').map(Number);
      const page = pages[p];
      const d = page?.diagrams[i];
      if (!d) return;

      document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('active', a.getAttribute('href') === `#${p}-${i}`));
      document.getElementById('title').textContent = d.label;
      document.getElementById('file').textContent = `docs/diagrams/${page.file}`;

      try {
        const { svg } = await mermaid.render(`d${renderCount++}`, d.code);
        box.innerHTML = svg;
        const vb = box.querySelector('svg').viewBox.baseVal;
        size = { w: vb.width, h: vb.height };
        box.scrollTo(0, 0);
        setZoom(1); // laging nagsisimula sa totoong laki — nababasa ang text
      } catch (err) {
        size = null;
        box.innerHTML = '';
        const pre = document.createElement('pre');
        pre.className = 'error';
        pre.textContent = `May mali sa diagram na ito:\n${err.message}`;
        box.appendChild(pre);
      }
    };

    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
