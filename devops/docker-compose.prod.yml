# 🚨 Sariling project name — HINDI dapat bumangga sa dev compose (`auth-learning`, Day 07)
name: auth-learning-prod

services:
  backend:
    # Galing sa CI (GHCR), hindi binubuo dito — ang EKSAKTONG image na pumasa sa tests (Day 37).
    # IMAGE_TAG = commit SHA; itinatakda ng devops/deploy.sh
    image: ghcr.io/nelson1869-ai/auth-learning-backend:${IMAGE_TAG:?run ./deploy.sh (sets IMAGE_TAG)}
    # Secrets (Neon DATABASE_URL, JWT_PRIVATE_KEY, …) — gitignored, hindi kailanman nasa image
    env_file: ../backend/.env.production
    restart: unless-stopped
    # Walang `ports:` — hindi kailangang buksan sa PC; si cloudflared lang ang kumakausap dito

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3 # naka-pin na version — hindi `latest` (devops README)
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    # Pareho ang UID sa may-ari ng credentials file sa PC (600/400) — para mabasa nang hindi niluluwagan ang permission
    user: "1000:1000"
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${HOME}/.cloudflared/714ae270-6cfe-4ace-90ba-59d054bf2ea5.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      backend:
        condition: service_healthy # hintayin ang HEALTHCHECK ng backend image bago magbukas sa internet
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # Monitoring (Day 82): Prometheus (nag-iipon ng metrics) + Grafana (dashboard).
  # 🔐 127.0.0.1 LANG: ang PC lang ang makakapasok — hindi ang LAN, at hindi dinadaanan ng tunnel.
  # Ibang port sa mga default (9090, 3001 ay gamit na sa PC na ito). May limit ng memory: hindi dapat kainin
  # ng monitoring ang kailangan ng app mismo (iisang PC lang ito)
  prometheus:
    image: prom/prometheus:v3.7.3 # naka-pin
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d # 15 araw lang — hindi lalaki nang walang hangganan
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0 # naka-pin
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Galing sa devops/.env (gitignored) — hindi kailanman naka-commit
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in devops/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Huwag mag-download ng mga plugin mula sa internet tuwing boot (hindi natin kailangan; mas kaunting code na hindi natin sinuri)
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Iisang read-only mount para sa lahat ng provisioning (datasource + dashboards/json)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

