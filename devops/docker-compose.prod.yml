# 🚨 Sariling project name — HINDI dapat bumangga sa dev compose (`auth-learning`, Day 07)
name: auth-learning-prod

services:
  backend:
    # Galing sa CI (GHCR), hindi binubuo dito — ang EKSAKTONG image na pumasa sa tests (Day 37).
    # IMAGE_TAG = commit SHA; itinatakda ng devops/deploy.sh
    image: ghcr.io/nelson1869-ai/auth-learning-backend:${IMAGE_TAG:?run ./deploy.sh (sets IMAGE_TAG)}
    # Secrets (Neon DATABASE_URL, JWT_PRIVATE_KEY, …) — gitignored, hindi kailanman nasa image
    env_file: ../backend/.env.production
    restart: unless-stopped
    # Day 85: gaano katagal maghihintay ang `docker stop` (at ang deploy) bago SIGKILL. Ang app ay may sariling deadline
    # na 8s (index.ts), MAS MAIKLI rito — para ang app ang magpasya kung ano ang puputulin, at may log ito
    stop_grace_period: 10s
    # Walang `ports:` — hindi kailangang buksan sa PC; si cloudflared lang ang kumakausap dito

  # Redis (Day 92): ang bilang ng rate limiter — hindi na nare-reset sa bawat deploy ng backend, at handa kung dalawa na ang backend.
  # Walang `ports:` (sa loob lang ng Docker network, kaya walang password), walang persistence (mga bilang lang na may expiry),
  # at may limit ng memory. Kapag patay ito: fail-open ang rate limiter (alert: RedisDown); nasa database ang account lockout
  redis:
    image: redis:8.8.3-alpine # naka-pin
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-ttl"]
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3 # naka-pin na version — hindi `latest` (devops README)
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    # Pareho ang UID sa may-ari ng credentials file sa PC (600/400) — para mabasa nang hindi niluluwagan ang permission
    user: "1000:1000"
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${HOME}/.cloudflared/714ae270-6cfe-4ace-90ba-59d054bf2ea5.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      backend:
        condition: service_healthy # hintayin ang HEALTHCHECK ng backend image bago magbukas sa internet
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # Monitoring (Day 82): Prometheus (nag-iipon ng metrics) + Grafana (dashboard) · Day 84: + Alertmanager (email).
  # 🔐 127.0.0.1 LANG: ang PC lang ang makakapasok — hindi ang LAN, at hindi dinadaanan ng tunnel.
  # Ibang port sa mga default (9090, 3001 ay gamit na sa PC na ito). May limit ng memory: hindi dapat kainin
  # ng monitoring ang kailangan ng app mismo (iisang PC lang ito)
  prometheus:
    image: prom/prometheus:v3.7.3 # naka-pin
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d # 15 araw lang — hindi lalaki nang walang hangganan
      - --storage.tsdb.retention.size=1GB
      - --web.external-url=http://127.0.0.1:9091 # para gumana ang mga link sa alert email (sa PC na ito)
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2 # naka-pin
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Galing sa devops/.env (gitignored) — hindi kailanman naka-commit
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in devops/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Huwag mag-download ng mga plugin mula sa internet tuwing boot (hindi natin kailangan; mas kaunting code na hindi natin sinuri)
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Iisang read-only mount para sa lahat ng provisioning (datasource + dashboards/json)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Alertmanager (Day 84): tumatanggap ng mga alert mula sa Prometheus → email (Resend SMTP).
  # Walang secret sa config: ang password at ang recipient ay galing sa devops/.env, at isinusulat ng start.sh
  # sa isang tmpfs (memory lang) na ang may-ari ay ang user ng alertmanager (nobody, 65534)
  alertmanager:
    image: prom/alertmanager:v0.28.1 # naka-pin
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO in devops/.env}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:?set ALERT_SMTP_PASSWORD in devops/.env (Resend API key)}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager # silences + kung anong naipadala na (para walang dobleng email pagka-restart)
    tmpfs:
      - /run/alertmanager:uid=65534,gid=65534,mode=0700,size=1m
    ports:
      - "127.0.0.1:9094:9093" # 9093 ay gamit na ng reference
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

