name: auth-learning          # 🚨 iwas-banggaan sa ibang compose project

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # galing sa devops/.env
      POSTGRES_DB: auth_learning
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Day 92: Redis para sa rate limiter (dev at tests). Walang data na kailangang itago (mga bilang lang, may expiry),
  # kaya walang volume. 127.0.0.1 lang; 6380 (hindi 6379) para hindi bumangga sa ibang Redis sa PC
  redis:
    image: redis:8.8.3-alpine # naka-pin
    command: ["redis-server", "--save", "", "--appendonly", "no"] # walang persistence
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata:
